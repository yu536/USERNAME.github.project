<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адаптивный пример</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fjalla One', sans-serif;
    }

    body,
    html {
      height: 100%;
      background: #0b0f1a;
      color: #fff;
    }

    header,
    footer {
      position: fixed;
      width: 100%;
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #0b0f1a, #001f3f, #00c3ff22);
      box-shadow: inset 0 0 100px rgba(0, 195, 255, 0.05), 0 0 40px rgba(0, 195, 255, 0.1),
        0 0 80px rgba(0, 0, 0, 0.9);
      z-index: 10;
      opacity: 0;
    }

    header {
      top: 0;
      transform: translateY(-100%);
      animation: slide-down 1s ease forwards;
      animation-delay: 0.3s;
    }

    footer {
      bottom: 0;
      height: 120px;
      transform: translateY(100%);
      animation: slide-up 1s ease forwards;
      animation-delay: 0.3s;
    }

    @keyframes slide-down {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slide-up {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    section {
      min-height: 100vh;
      padding-top: 140px;
      padding-bottom: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #050d1a, #0a1c3c);
    }

    .menu {
      position: relative;
      display: flex;
      align-items: center;
      gap: 20px;
      overflow: hidden;
      height: 100px;
      justify-content: center;
      margin-bottom: 30px;
      opacity: 0;
      animation: fade-in 0.5s ease forwards;
      animation-delay: 1.2s;
    }

    .menu::before {
      content: "";
      display: block;
      width: 4px;
      height: 0;
      background-color: #00c3ff;
      animation: vertical-line-grow 0.7s forwards;
      box-shadow: 0 0 10px #00c3ff, 0 0 25px #00c3ff88;
    }

    .menu h1 {
      opacity: 0;
      font-size: 70px;
      animation: slide-text-in 0.8s forwards;
      animation-delay: 1.1s;
      transform: translateX(-50px);
      color: #00c3ff;
      text-shadow: 0 0 10px rgba(0, 195, 255, 0.8);
    }

    .cards {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 30px;
      opacity: 0;
      animation: fade-in 0.8s forwards;
      animation-delay: 2.0s;
    }

    .card {
      width: 280px;
      height: 320px;
      background-color: #0d1117;
      border: 2px solid #00c3ff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 20px rgba(0, 195, 255, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      animation: fade-in-card 0.8s forwards;
      cursor: pointer;
    }

    .card:nth-child(1) {
      animation-delay: 2.2s;
    }

    .card:nth-child(2) {
      animation-delay: 2.4s;
    }

    .card img {
      width: 100%;
      height: 360px;
      object-fit: cover;
    }

    .card h3 {
      text-align: center;
      padding: 15px;
      font-size: 20px;
      color: #00c3ff;
      text-shadow: 0 0 8px rgba(0, 195, 255, 0.6);
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 25px rgba(0, 195, 255, 0.4);
    }

    @keyframes vertical-line-grow {
      from {
        height: 0;
        opacity: 0;
      }

      to {
        height: 80px;
        opacity: 1;
      }
    }

    @keyframes slide-text-in {
      0% {
        opacity: 0;
        transform: translateX(-50px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fade-in {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes fade-in-card {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    /* ====== Responsive ====== */
    @media (max-width: 1200px) {
      .menu h1 {
        font-size: 56px;
      }

      .cards {
        gap: 20px;
      }

      .card {
        width: 240px;
        height: 380px;
      }

      .card img {
        height: 300px;
      }
    }

    @media (max-width: 768px) {
      .menu h1 {
        font-size: 36px;
      }

      .cards {
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 90%;
        height: auto;
      }

      .card img {
        height: 200px;
      }

      footer {
        padding: 20px;
        height: auto;
      }

      section {
        padding-top: 120px;
        padding-bottom: 120px;
      }
    }

    @media (max-width: 480px) {
      .menu h1 {
        font-size: 28px;
      }

      .card h3 {
        font-size: 16px;
        padding: 10px;
      }

      section {
        padding-top: 100px;
        padding-bottom: 100px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="colls">
      <h1>亚 洲 媒 体</h1>
    </div>
  </header>

  <section>
    <div class="main-paper">
      <div class="menu">
        <h1>Menu</h1>
      </div>

      <div class="cards">
        <div class="card" id="index1">
          <img src="https://olcha.uz/image/700x700/products/supplier/stores/1/2023-09-11/KGBuvJjs7eplTS28kPLVB6SNmrP76MqQ6216eetMID4RF1j4VgZH5qOkdJSc.jpg" alt="BMW" />
          <h3>Старая Конституция</h3>
        </div>
        <div class="card" id="index2">
          <img src="https://oliymahad.uz/wp-content/uploads/2021/12/383-600x413.jpg"
            alt="mersedes" />
          <h3>Новая Конституция</h3>
        </div>
      </div>
    </div>
  </section>

  <footer></footer>

  <script>
    document.getElementById('index1').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    document.getElementById('index2').addEventListener('click', () => {
      window.location.href = 'indexX.html';
    });
  </script>
</body>

</html>
